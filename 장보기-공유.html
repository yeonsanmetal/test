<title>우리 집 장보기</title>
<style>
  /* 레이아웃: 가운데 한 줄 기둥에 분류별 카드를 쌓는 휴대폰 우선 목록 */
  :root {
    --bg: #fbf5ea;
    --card: #fffdf8;
    --line: #eadfcc;
    --line-soft: #f3ebdd;
    --text: #4a3426;
    --muted: #9a8573;
    --accent: #d2693c;
    --accent-dark: #b4532a;
    --accent-soft: #f6e3d3;
    --olive: #7d8c3c;
    --input-bg: #ffffff;
    --check-ring: #d9c7b0;
    --shadow: 0 2px 10px rgba(120, 80, 40, 0.08);
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221a14; --card: #2e241c; --line: #4a3b2e; --line-soft: #3a2e24;
      --text: #f1e4d4; --muted: #b09a85; --accent: #e5865a; --accent-dark: #f0a07a;
      --accent-soft: #4a2f20; --olive: #9fae58; --input-bg: #261e17; --check-ring: #6a5644;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #221a14; --card: #2e241c; --line: #4a3b2e; --line-soft: #3a2e24;
    --text: #f1e4d4; --muted: #b09a85; --accent: #e5865a; --accent-dark: #f0a07a;
    --accent-soft: #4a2f20; --olive: #9fae58; --input-bg: #261e17; --check-ring: #6a5644;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding-block: 28px 48px; padding-inline: 16px; }

  header { text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; text-wrap: balance; }
  header h1 span { margin-right: 6px; }
  .remain {
    display: inline-block; margin-top: 8px; padding: 4px 14px;
    background: var(--accent-soft); color: var(--accent-dark);
    border-radius: 999px; font-weight: 600; font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .notice {
    margin: 0 0 16px; padding: 10px 14px; border-radius: 12px;
    background: var(--accent-soft); color: var(--accent-dark);
    font-size: 14px; text-align: center;
  }

  .add {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--card); padding: 12px; border-radius: 18px;
    box-shadow: var(--shadow); margin-bottom: 20px;
  }
  .add input, .add select {
    font: inherit; color: var(--text);
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 10px 12px; background: var(--input-bg); min-width: 0;
  }
  .add input { flex: 1 1 160px; }
  .add select { flex: 0 1 150px; }
  .add input:focus-visible, .add select:focus-visible { outline: none; border-color: var(--accent); }
  .btn-primary {
    font: inherit; font-weight: 700; color: #fff;
    background: var(--accent); border: none; border-radius: 12px;
    padding: 10px 20px; cursor: pointer;
  }
  .btn-primary:hover { filter: brightness(0.94); }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  .cat {
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    padding: 14px 16px 8px; margin-bottom: 14px;
  }
  .cat-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 8px; border-bottom: 1.5px dashed var(--line);
  }
  .cat-head h2 { margin: 0; font-size: 18px; }
  .cat-head small { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 2px; border-bottom: 1px solid var(--line-soft);
  }
  li:last-child { border-bottom: none; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }

  .check {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--check-ring); background: var(--input-bg); cursor: pointer;
    display: grid; place-items: center; padding: 0;
    transition: background .15s, border-color .15s;
  }
  .check:hover { border-color: var(--olive); }
  .check svg { width: 15px; height: 15px; opacity: 0; }
  li.done .check { background: var(--olive); border-color: var(--olive); }
  li.done .check svg { opacity: 1; }
  .check:disabled { cursor: default; }

  .name { flex: 1; min-width: 0; font-size: 16px; overflow-wrap: anywhere; cursor: pointer; }
  li.done .name { text-decoration: line-through; color: var(--muted); opacity: .75; }
  .readonly .name { cursor: default; }

  .del {
    flex: none; border: none; background: none; color: var(--muted);
    font-size: 18px; cursor: pointer; width: 30px; height: 30px; border-radius: 8px;
  }
  .del:hover { color: var(--accent-dark); background: var(--accent-soft); }

  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .footer { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
  .btn-outline {
    font: inherit; font-weight: 600;
    color: var(--accent-dark); background: transparent;
    border: 1.5px solid var(--accent); border-radius: 999px;
    padding: 10px 24px; cursor: pointer;
  }
  .btn-outline:hover { background: var(--accent-soft); }
  .btn-outline:disabled { opacity: .4; cursor: default; background: transparent; }
  .confirm-text { width: 100%; text-align: center; margin: 0; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app">
  <header>
    <h1><span>🛒</span>우리 집 장보기</h1>
    <div class="remain" id="remain">목록을 불러오는 중이에요</div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <form class="add" id="addForm">
    <input id="itemName" type="text" placeholder="살 것을 적어 주세요" autocomplete="off" maxlength="40" required>
    <select id="itemCat"></select>
    <button class="btn-primary" id="addBtn" type="submit">추가</button>
  </form>

  <main id="list"></main>

  <div class="footer" id="footer">
    <button class="btn-outline" id="clearBtn" type="button">🧹 다 산 것 비우기</button>
  </div>
</div>

<script>
  const CATEGORIES = [
    { id: "veg",    name: "채소·과일",   icon: "🥬" },
    { id: "meat",   name: "정육·수산",   icon: "🥩" },
    { id: "dairy",  name: "유제품·달걀", icon: "🥛" },
    { id: "pantry", name: "가공·양념",   icon: "🍚" },
    { id: "home",   name: "생활용품",    icon: "🧻" },
  ];
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  const listEl = document.getElementById("list");
  const remainEl = document.getElementById("remain");
  const noticeEl = document.getElementById("notice");
  const footerEl = document.getElementById("footer");
  const form = document.getElementById("addForm");
  const nameInput = document.getElementById("itemName");
  const catSelect = document.getElementById("itemCat");
  const addBtn = document.getElementById("addBtn");

  for (const cat of CATEGORIES) {
    const opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.icon + " " + cat.name;
    catSelect.appendChild(opt);
  }

  let items = [];          // [{id, name, cat, done, createdAt}]
  let loaded = false;
  let db = null;
  let canWrite = false;
  let confirming = false;

  function showNotice(text) {
    noticeEl.textContent = text;
    noticeEl.hidden = !text;
  }

  function setReadOnly(on) {
    canWrite = !on;
    document.getElementById("app").classList.toggle("readonly", on);
    form.hidden = on;
    footerEl.hidden = on;
  }

  function render() {
    listEl.innerHTML = "";
    for (const cat of CATEGORIES) {
      // 안 산 것 먼저, 산 것은 아래로 (각 그룹 안에서는 추가한 순서 유지)
      const catItems = items.filter(i => i.cat === cat.id);
      const sorted = [...catItems.filter(i => !i.done), ...catItems.filter(i => i.done)];
      const left = catItems.filter(i => !i.done).length;

      const section = document.createElement("section");
      section.className = "cat";
      const head = document.createElement("div");
      head.className = "cat-head";
      head.innerHTML = `<h2>${cat.icon} ${cat.name}</h2><small>${catItems.length ? left + "개 남음" : ""}</small>`;
      section.appendChild(head);

      const ul = document.createElement("ul");
      if (!sorted.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = loaded ? "비어 있어요" : "불러오는 중…";
        ul.appendChild(li);
      }
      for (const item of sorted) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.innerHTML = CHECK_SVG;
        check.setAttribute("aria-label", (item.done ? "체크 해제: " : "체크: ") + item.name);
        check.disabled = !canWrite;
        check.onclick = () => toggle(item);

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;
        if (canWrite) name.onclick = () => toggle(item);

        li.append(check, name);
        if (canWrite) {
          const del = document.createElement("button");
          del.className = "del";
          del.type = "button";
          del.textContent = "✕";
          del.title = "삭제";
          del.setAttribute("aria-label", "삭제: " + item.name);
          del.onclick = () => removeItem(item);
          li.appendChild(del);
        }
        ul.appendChild(li);
      }
      section.appendChild(ul);
      listEl.appendChild(section);
    }

    const totalLeft = items.filter(i => !i.done).length;
    const doneCount = items.length - totalLeft;
    if (loaded) {
      remainEl.textContent = items.length === 0
        ? "목록이 비어 있어요"
        : totalLeft === 0 ? "다 샀어요! 🎉" : `${totalLeft}개 남았어요`;
    }
    renderFooter(doneCount);
  }

  // 브라우저 확인창이 뜨지 않는 곳이라, 확인 단계를 화면 안에 만든다
  function renderFooter(doneCount) {
    footerEl.innerHTML = "";
    if (confirming && doneCount > 0) {
      const p = document.createElement("p");
      p.className = "confirm-text";
      p.textContent = `다 산 것 ${doneCount}개를 목록에서 지울까요?`;
      const yes = document.createElement("button");
      yes.className = "btn-primary"; yes.type = "button"; yes.textContent = "비우기";
      yes.onclick = clearDone;
      const no = document.createElement("button");
      no.className = "btn-outline"; no.type = "button"; no.textContent = "취소";
      no.onclick = () => { confirming = false; render(); };
      footerEl.append(p, yes, no);
      return;
    }
    confirming = false;
    const btn = document.createElement("button");
    btn.className = "btn-outline"; btn.type = "button";
    btn.textContent = "🧹 다 산 것 비우기";
    btn.disabled = doneCount === 0;
    btn.onclick = () => { confirming = true; render(); };
    footerEl.appendChild(btn);
  }

  function handleWriteError(e) {
    if (e && e.code === "invalid_argument") {
      setReadOnly(true);
      showNotice("이 목록은 보기만 할 수 있어요. 고치려면 주인에게 편집 권한을 받아 주세요.");
      render();
    } else if (e && e.code === "quota_exceeded") {
      showNotice("목록이 가득 찼어요. 다 산 것을 비운 뒤 다시 추가해 주세요.");
    } else {
      showNotice("저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");
    }
  }

  async function toggle(item) {
    if (!canWrite) return;
    try { await db.doc("items/" + item.id).update({ done: !item.done }); showNotice(""); }
    catch (e) { handleWriteError(e); }
  }

  async function removeItem(item) {
    if (!canWrite) return;
    try { await db.doc("items/" + item.id).delete(); showNotice(""); }
    catch (e) { handleWriteError(e); }
  }

  async function clearDone() {
    confirming = false;
    const done = items.filter(i => i.done);
    try {
      for (const item of done) await db.doc("items/" + item.id).delete();
      showNotice("");
    } catch (e) { handleWriteError(e); }
    render();
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name || !canWrite) return;
    addBtn.disabled = true;
    try {
      await db.collection("items").add({ name, cat: catSelect.value, done: false, createdAt: Date.now() });
      nameInput.value = "";
      nameInput.focus();
      showNotice("");
    } catch (err) { handleWriteError(err); }
    addBtn.disabled = false;
  });

  async function start() {
    setReadOnly(true);
    render();

    db = await window.claude?.use?.("db") ?? null;
    if (!db) {
      loaded = true;
      remainEl.textContent = "목록을 열 수 없어요";
      showNotice("Claude에 로그인한 상태에서 열면 가족과 함께 쓰는 목록이 보여요.");
      render();
      return;
    }

    const user = await window.claude.use("user");
    const may = user ? await user.can("data.write") : null;
    // null이면 알 수 없음: 일단 쓸 수 있게 두고, 거절되면 보기 전용으로 바꾼다
    setReadOnly(may === false);
    if (may === false) showNotice("이 목록은 보기만 할 수 있어요. 고치려면 주인에게 편집 권한을 받아 주세요.");

    db.collection("items").orderBy("createdAt").onSnapshot(snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loaded = true;
      render();
    }, () => {
      loaded = true;
      remainEl.textContent = "목록을 불러오지 못했어요";
      showNotice("새로고침해 주세요.");
      render();
    });
  }

  start();
</script>
