<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #fbf5ea;
    --card: #fffdf8;
    --line: #eadfcc;
    --text: #4a3426;
    --muted: #9a8573;
    --accent: #d2693c;
    --accent-dark: #b4532a;
    --olive: #7d8c3c;
    --shadow: 0 2px 10px rgba(120, 80, 40, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }

  header { text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
  header h1 span { margin-right: 6px; }
  .remain {
    display: inline-block; margin-top: 8px; padding: 4px 14px;
    background: #f6e3d3; color: var(--accent-dark);
    border-radius: 999px; font-weight: 600; font-size: 15px;
  }

  .add {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--card); padding: 12px; border-radius: 18px;
    box-shadow: var(--shadow); margin-bottom: 20px;
  }
  .add input, .add select {
    font: inherit; color: var(--text);
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 10px 12px; background: #fff; min-width: 0;
  }
  .add input { flex: 1 1 160px; }
  .add select { flex: 0 1 150px; }
  .add input:focus, .add select:focus { outline: none; border-color: var(--accent); }
  .add button {
    font: inherit; font-weight: 700; color: #fff;
    background: var(--accent); border: none; border-radius: 12px;
    padding: 10px 20px; cursor: pointer;
  }
  .add button:hover { background: var(--accent-dark); }

  .cat {
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    padding: 14px 16px 8px; margin-bottom: 14px;
  }
  .cat-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 8px; border-bottom: 1.5px dashed var(--line);
  }
  .cat-head h2 { margin: 0; font-size: 18px; }
  .cat-head small { color: var(--muted); font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 2px; border-bottom: 1px solid #f3ebdd;
  }
  li:last-child { border-bottom: none; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }

  .check {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid #d9c7b0; background: #fff; cursor: pointer;
    display: grid; place-items: center; padding: 0;
    transition: background .15s, border-color .15s;
  }
  .check:hover { border-color: var(--olive); }
  .check svg { width: 15px; height: 15px; opacity: 0; }
  li.done .check { background: var(--olive); border-color: var(--olive); }
  li.done .check svg { opacity: 1; }

  .name { flex: 1; font-size: 16px; word-break: break-all; cursor: pointer; }
  li.done .name { text-decoration: line-through; color: var(--muted); opacity: .7; }

  .del {
    flex: none; border: none; background: none; color: #c9b8a5;
    font-size: 18px; cursor: pointer; width: 30px; height: 30px; border-radius: 8px;
  }
  .del:hover { color: var(--accent-dark); background: #f8ebe0; }

  .clear {
    display: block; margin: 22px auto 0; font: inherit; font-weight: 600;
    color: var(--accent-dark); background: transparent;
    border: 1.5px solid var(--accent); border-radius: 999px;
    padding: 10px 24px; cursor: pointer;
  }
  .clear:hover { background: #f6e3d3; }
  .clear:disabled { opacity: .4; cursor: default; background: transparent; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>🛒</span>우리 집 장보기</h1>
    <div class="remain" id="remain"></div>
  </header>

  <form class="add" id="addForm">
    <input id="itemName" type="text" placeholder="살 것을 적어 주세요" autocomplete="off" required>
    <select id="itemCat"></select>
    <button type="submit">추가</button>
  </form>

  <main id="list"></main>

  <button class="clear" id="clearBtn" type="button">🧹 다 산 것 비우기</button>
</div>

<script>
  const STORAGE_KEY = "our-home-shopping-list-v1";

  const CATEGORIES = [
    { id: "veg",   name: "채소·과일",   icon: "🥬" },
    { id: "meat",  name: "정육·수산",   icon: "🥩" },
    { id: "dairy", name: "유제품·달걀", icon: "🥛" },
    { id: "pantry",name: "가공·양념",   icon: "🍚" },
    { id: "home",  name: "생활용품",    icon: "🧻" },
  ];

  const DEFAULTS = {
    veg: ["대파", "양파", "감자", "사과"],
    meat: ["돼지고기", "닭고기", "고등어"],
    dairy: ["우유", "계란", "두부"],
    pantry: ["쌀", "라면", "간장"],
    home: ["휴지", "주방세제"],
  };

  let nextId = 1;
  const makeItem = (name, cat) => ({ id: Date.now() + "-" + nextId++, name, cat, done: false });

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    const items = [];
    for (const cat of CATEGORIES) {
      for (const name of DEFAULTS[cat.id]) items.push(makeItem(name, cat.id));
    }
    return items;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }

  let items = load();

  const listEl = document.getElementById("list");
  const remainEl = document.getElementById("remain");
  const clearBtn = document.getElementById("clearBtn");
  const catSelect = document.getElementById("itemCat");
  const nameInput = document.getElementById("itemName");

  for (const cat of CATEGORIES) {
    const opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.icon + " " + cat.name;
    catSelect.appendChild(opt);
  }

  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function render() {
    listEl.innerHTML = "";
    for (const cat of CATEGORIES) {
      // 안 산 것 먼저, 산 것은 아래로 (각 그룹 안에서는 추가한 순서 유지)
      const catItems = items.filter(i => i.cat === cat.id);
      const sorted = [...catItems.filter(i => !i.done), ...catItems.filter(i => i.done)];
      const left = catItems.filter(i => !i.done).length;

      const section = document.createElement("section");
      section.className = "cat";
      section.innerHTML = `
        <div class="cat-head">
          <h2>${cat.icon} ${cat.name}</h2>
          <small>${catItems.length ? left + "개 남음" : ""}</small>
        </div>`;

      const ul = document.createElement("ul");
      if (!sorted.length) {
        ul.innerHTML = '<li class="empty">비어 있어요</li>';
      }
      for (const item of sorted) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.innerHTML = CHECK_SVG;
        check.setAttribute("aria-label", item.done ? "체크 해제" : "체크");
        check.onclick = () => toggle(item.id);

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;
        name.onclick = () => toggle(item.id);

        const del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.textContent = "✕";
        del.title = "삭제";
        del.onclick = () => remove(item.id);

        li.append(check, name, del);
        ul.appendChild(li);
      }
      section.appendChild(ul);
      listEl.appendChild(section);
    }

    const totalLeft = items.filter(i => !i.done).length;
    const doneCount = items.length - totalLeft;
    remainEl.textContent = items.length === 0
      ? "목록이 비어 있어요"
      : totalLeft === 0 ? "다 샀어요! 🎉" : `${totalLeft}개 남았어요`;
    clearBtn.disabled = doneCount === 0;
  }

  function toggle(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    save(); render();
  }

  function remove(id) {
    items = items.filter(i => i.id !== id);
    save(); render();
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;
    items.push(makeItem(name, catSelect.value));
    nameInput.value = "";
    nameInput.focus();
    save(); render();
  });

  clearBtn.addEventListener("click", () => {
    const n = items.filter(i => i.done).length;
    if (!n) return;
    if (!confirm(`다 산 것 ${n}개를 목록에서 지울까요?`)) return;
    items = items.filter(i => !i.done);
    save(); render();
  });

  render();
</script>
</body>
</html>
